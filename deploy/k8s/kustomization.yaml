# duse 서버 K3s에 올리는 short-url. scripts/deploy.sh가 이 폴더를 서버의 /opt/short-url/k8s로 복사해
# `sudo k3s kubectl apply -k`로 적용한다. 비밀(short-url-kakao)은 여기 없고 서버의 .env에서 만든다(docs/deploy/duse.md).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: short-url
labels:
  - pairs:
      app.kubernetes.io/name: short-url
    includeSelectors: true
resources:
  - namespace.yaml
  - deployment.yaml
