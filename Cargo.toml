[package]
name = "short-url"
version = "0.1.0"
edition = "2021"

[dependencies]
dioxus = { version = "0.7.10", features = ["fullstack"] }
serde = { version = "1", features = ["derive"] }
# 서버 전용. rustls(webpki 루트 인증서 내장)라 `sslmode=require` 주소도 시스템 인증서 없이 연결한다.
sqlx = { version = "0.9", default-features = false, features = ["postgres", "runtime-tokio", "tls-rustls-ring-webpki"], optional = true }
url = { version = "2.5", optional = true }

[features]
default = ["web"]
web = ["dioxus/web"]
server = ["dioxus/server", "dep:sqlx", "dep:url"]

[dev-dependencies]
# `cargo test`만으로 서버 라우터 테스트가 돌도록 테스트 빌드에서 server 기능을 켠다.
short-url = { path = ".", features = ["server"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
serde_json = "1"
# 테스트마다 따로 쓸 데이터베이스를 만들고 지우는 데 쓴다.
sqlx = { version = "0.9", default-features = false, features = ["postgres", "runtime-tokio"] }
