[package]
name = "short-url"
version = "0.1.0"
edition = "2021"

[dependencies]
dioxus = { version = "0.7.10", features = ["fullstack"] }
serde = { version = "1", features = ["derive"] }
# 서버 전용. SQLite는 크레이트에 묶여(bundled) 빌드되므로 시스템 라이브러리가 필요 없다.
sqlx = { version = "0.9", default-features = false, features = ["sqlite", "runtime-tokio"], optional = true }
url = { version = "2.5", optional = true }
# 한글 도메인(`xn--...`)을 읽을 수 있는 글자로 바꿔 기본 Link Name을 만든다. url 크레이트가 이미 쓰는 판이다.
idna = { version = "1.1", optional = true }
getrandom = { version = "0.3", optional = true }
serde_json = { version = "1", optional = true }
# 카카오 로그인(토큰 발급, 사용자 정보 조회) 호출에 쓴다. 서버 전용.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"], optional = true }

[features]
default = ["web"]
web = ["dioxus/web"]
server = ["dioxus/server", "dep:sqlx", "dep:url", "dep:idna", "dep:getrandom", "dep:reqwest", "dep:serde_json"]

[dev-dependencies]
# `cargo test`만으로 서버 라우터 테스트가 돌도록 테스트 빌드에서 server 기능을 켠다.
short-url = { path = ".", features = ["server"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
serde_json = "1"
# 테스트에서 저장소 파일에 직접 붙어 테이블을 망가뜨리는 데 쓴다.
sqlx = { version = "0.9", default-features = false, features = ["sqlite", "runtime-tokio"] }
