services:
  - type: web
    name: short-url
    runtime: docker
    plan: free
    region: singapore
    healthCheckPath: /
    envVars:
      # Render가 붙여 주는 서비스 주소(https://<이름>.onrender.com)를 그대로 BASE_URL로 쓴다.
      # 커스텀 도메인을 붙이면 이 항목 대신 BASE_URL을 직접 넣는다.
      - key: BASE_URL
        fromService:
          type: web
          name: short-url
          envVarKey: RENDER_EXTERNAL_URL
      - key: DATABASE_URL
        fromDatabase:
          name: short-url-db
          property: connectionString
      # 카카오 로그인 키(docs/deploy/render.md). 값은 저장소에 두지 않고 대시보드에서 넣는다.
      - key: KAKAO_REST_API_KEY
        sync: false
      - key: KAKAO_CLIENT_SECRET
        sync: false

databases:
  - name: short-url-db
    plan: free
    region: singapore
    databaseName: short_url
